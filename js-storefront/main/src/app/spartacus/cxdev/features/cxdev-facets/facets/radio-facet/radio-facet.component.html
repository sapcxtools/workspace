@if (facet.values) {
	<strong>{{ facet.name }}</strong>
	<span class="facetClearLink">
		@if (showClearLink()) {
			<a (click)="clearFacet()" class="link cursor-pointer">
				<cx-icon class="fas fa-times"></cx-icon>
			</a>
		}
	</span>
	<form>
		@for (value of facet.values; track value) {
			<label>
				<input
					type="radio"
					name="radiofacet"
					[checked]="value.selected"
					(change)="onSubmit(value)" />
				{{ value.name }} ({{ value.count }})
			</label>
		}
	</form>
}
